if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
// Hand-made pixel art from the Studio lives in art/library.json. Each entry: {type:'head',id,name,rarity,where,pal,px}.
// It's loaded at start and the app redraws once it arrives (not during team setup, so typing isn't lost).
// Library items that used to be built in keep their old place in the Locker
const LIB_ORDER={logo:["ball", "shield", "flame", "bolt", "mountain", "swords", "crown", "owl", "rocket", "star", "anchor", "jacko", "reindeer", "shamrock", "boombox", "neonhoop"],kit:["home", "away", "retro", "pinstripe", "legend", "neon", "sunset", "galaxy", "witch", "jumper", "hoops", "tagged"]};
// Their unlock rules (achievements, Store packs, Item Shop, events) stay in the code by id: the library only holds the artwork and name,
// so a library entry's where/rarity never changes how one of these is unlocked.
const wasBuiltIn=(k,v)=>!!(LIB_ORDER[k]&&LIB_ORDER[k].includes(v));
function libSort(list,k){const O=LIB_ORDER[k]||[],pos=new Map(list.map((x,i)=>[x[0],i])),key=id=>O.includes(id)?O.indexOf(id):O.length+pos.get(id);list.sort((a,b)=>key(a[0])-key(b[0]))}
function addArt(lib){let n=0;for(const a of lib||[]){if(!a||!a.id)continue;
  if(a.type==='head'){if(!a.px||HEADS.some(h=>h.id===a.id))continue;
    HEADS.push({id:a.id,n:a.name,px:a.px,pal:a.pal,shape:'std',fx:[],skin:['#d39a6a','#b07a4e'],hair:'#1b120c',style:'bald',band:'none',mouth:'flat'});HEAD_LIST.push([a.id,a.name])}
  else if(a.type==='logo'){if(!a.px||LOGOS.some(x=>x[0]===a.id))continue;CUSTOM_LOGO[a.id]=pxGrid(a);LOGOS.push([a.id,a.name])}
  else if(a.type==='kit'){if(KITDEF[a.id]||!KIT_PATS.includes(a.pat))continue;const K={n:a.name,b:a.b,t:a.t,num:a.num,pat:a.pat};for(const f of ['ns','sw','font','fw'])if(a[f]!=null)K[f]=a[f];KITDEF[a.id]=K;KITS.push([a.id,a.name])}
  else if(a.type==='pbg'){if(PBG_CSS[a.id]||!PBG_CSS[a.base]||CUSTOM_PBG[a.base])continue;const [bg,size]=PBG_CSS[a.base];PBG_CSS[a.id]=[swapColors(bg,a.colors),size];CUSTOM_PBG[a.id]=a.base;
    PBG_STYLE.textContent+='\n'+pbgRule(a.id,PBG_CSS[a.id][0],size);PBGS.push([a.id,a.name])}
  else continue;
  if(a.where==='shop'&&!wasBuiltIn(a.type,a.id)){RESERVED.push([a.type,a.id]);SHOP_RAR[a.type+':'+a.id]=a.rarity||CAT_RAR[a.type]||'epic'}n++}
  if(n){libSort(LOGOS,'logo');libSort(KITS,'kit')}return n}
// Logos and kits come from the library, so the first render waits for it (cached by the service worker, so this is quick, even offline).
// If it takes longer than 1.5s the app starts with the fallbacks and re-renders when it arrives. The team's choices are never changed.
let booted=false,libReady;const LIB_READY=new Promise(r=>libReady=r);
function boot(){if(booted)return;booted=true;render()}
fetch('art/library.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).then(l=>{const n=addArt(l);libReady(n);if(!booted)boot();else if(n&&S.team&&S.firstStart)render()}).catch(()=>{libReady(0);boot()});
setTimeout(boot,1500);
// Used by the Studio page (studio.html), which loads the app in a hidden frame to draw with the app's own code.
window.HL_ART={grid:p=>faceGridHD(p),svg:(G,scale)=>headGridSvg(G,scale),heads:()=>HEADS.map(h=>({id:h.id,n:h.n})),
  headGrid:id=>{const H=HEADS.find(h=>h.id===id);return H&&H.px?pxGrid(H):faceGridHD({id:'x',head:id})},
  base:(skin,shape)=>faceGridHD({id:'x',params:{sk:SKINS[skin][0],sh:SKINS[skin][1],shape}}),skins:SKINS,hairs:HAIRS,shapes:Object.keys(HD_SHAPES),
  // parts kit: build a head from parts with the app's own drawing code
  build:o=>faceGridHD({id:'x',params:{sk:SKINS[o.skin][0],sh:SKINS[o.skin][1],shape:o.shape,hair:o.hair,style:o.style,band:o.band||'none',mouth:o.mouth,fx:o.fx||[]}}),
  parts:{styles:['bald','buzz','short','flat','curly','coils','spiky','mohawk','afro','topknot','long','horseshoe'],mouths:['flat','smile','grin','open'],
    extras:['beard','stache','thinstache','goatee','vandyke','glasses','shades','goggles','sportspecs','scowl','cap','lephat','crown'],bands:BANDS.map(b=>b[0])},
  // team logos (16x16)
  logos:()=>LOGOS.map(([id,n])=>({id,n})),logoGrid:id=>logoGrid(id),logoSvg:G=>gridSvg(G),
  // kits
  kits:()=>KITS.map(([id])=>{const K=KITDEF[id],o={id,n:K.n};for(const f of ['b','t','num','pat','ns','sw','font','fw'])if(K[f]!=null)o[f]=K[f];return o}),
  kitPatterns:KIT_PATS,kitFonts:KIT_FONTS,kitSvg:(def,name,num)=>jerseySvg(def,name,num),
  // player backgrounds
  pbgs:()=>PBGS.map(([id,n])=>{const [bg,size]=PBG_CSS[id]||['',''],o={id,n,bg,size};if(CUSTOM_PBG[id])o.base=CUSTOM_PBG[id];return o}),
  pbgStyle:(bg,size)=>pbgStyle(bg,size),
  // how an item is unlocked, in plain English (the app's rules, by id)
  unlockInfo:(type,id)=>unlockInfo(type,id),
  // resolves once art/library.json has been added (logos and kits live there)
  ready:LIB_READY};
</script>
