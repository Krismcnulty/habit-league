<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Your habits are your squad. Every day is a game.">
<title>Habit League</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Mountains of Christmas";src:url(fonts/mountains-of-christmas-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Monoton";src:url(fonts/monoton-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Pacifico";src:url(fonts/pacifico-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Bebas Neue";src:url(fonts/bebas-neue-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Creepster";src:url(fonts/creepster-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Permanent Marker";src:url(fonts/permanent-marker-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"Press Start 2P";src:url(fonts/press-start-2p-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:"VT323";src:url(fonts/vt323-latin-400-normal.woff2) format("woff2");font-display:swap}

:root{
  --bg:#0b1020;--panel:#141b2e;--panel2:#1a2340;--line:#26304d;--text:#eef2ff;--muted:#8d96b5;
  --orange:#ff7a1a;--orange2:#ffb066;--green:#22c55e;--red:#f05252;--gold:#fbbf24;--blue:#60a5fa;
  --layup:#94a3b8;--jumper:#2dd4bf;--three:#a78bfa;--dunk:#ff7a1a;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0;letter-spacing:.02em}
.cond{font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-stretch:condensed;text-transform:uppercase;font-weight:800;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a0d00}
.btn.danger{color:var(--red)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.av{width:46px;height:46px;flex:none;border-radius:12px;background:linear-gradient(180deg,#1f2a4a,#121a33);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.av svg{width:40px;height:40px;image-rendering:pixelated;display:block}
.posn{font-weight:700}
.pos{font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:#0f1630;color:var(--orange2);border:1px solid var(--line);min-width:38px;text-align:center}
.shot-layup{color:var(--layup)}.shot-jumper{color:var(--jumper)}.shot-three{color:var(--three)}.shot-dunk{color:var(--dunk)}
.top{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
.top h1{font-size:24px}
/* scoreboard */
.board{background:radial-gradient(120% 140% at 50% -20%,#2a1a0e 0%,#141b2e 55%);border:1px solid #3a2a1c;border-radius:20px;padding:16px 14px 14px;position:relative;overflow:hidden}
.board:after{content:"";position:absolute;inset:auto -40px -70px auto;width:180px;height:180px;border:2px solid rgba(255,122,26,.12);border-radius:50%}
.phase{font-size:12px;text-align:center;color:var(--orange2);margin-bottom:10px}
.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.tm{text-align:center;min-width:0}
.badge{width:46px;height:46px;border-radius:12px;margin:0 auto 6px;display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff;letter-spacing:.04em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tmname{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{font-size:12px;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:900;font-size:44px;line-height:1}
.score .dash{font-size:22px;color:var(--muted)}
.score .lead{color:var(--orange)}
.bar{height:8px;border-radius:99px;background:#0c1226;margin:14px 0 8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange2));border-radius:99px;transition:width .4s}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff}
.status{text-align:center;font-weight:700}
/* players */
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 8px}
.sect h3{font-size:14px;color:var(--muted)}
.pl{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.pl+.pl{margin-top:8px}
.pl .nm{font-weight:650}
.pl .meta{font-size:12px;color:var(--muted)}
.pl.done{border-color:rgba(34,197,94,.45);background:linear-gradient(90deg,rgba(34,197,94,.10),var(--panel) 60%)}
.pl.inj{opacity:.55}
.tick{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:20px;font-weight:900}
.done .tick{background:var(--green);border-color:var(--green);color:#052e12}
.steps{margin:8px 0 0 58px;display:flex;flex-wrap:wrap;gap:6px}
.step{padding:6px 10px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--panel2)}
.step.on{background:rgba(34,197,94,.18);border-color:var(--green);color:#bbf7d0}
.fire{font-size:12px;color:var(--orange2);font-weight:700}
.empty{border:1.5px dashed var(--line);background:transparent;color:var(--muted);justify-content:center}
/* table */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);text-align:right;padding:6px 4px;font-weight:700;letter-spacing:.05em}
td{padding:9px 4px;text-align:right;border-top:1px solid var(--line);font-size:14px}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:center;width:24px;color:var(--muted)}
tr.me td{background:rgba(255,122,26,.10);font-weight:700}
tr.cut td{border-top:2px dashed var(--orange)}
.mini{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;font-size:9px;font-weight:900;color:#fff;margin-right:8px;vertical-align:middle}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--panel2);color:var(--text)}
.res{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.wl{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:13px}
.W{background:rgba(34,197,94,.18);color:var(--green)}.L{background:rgba(240,82,82,.16);color:var(--red)}
.series{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px}
.series+.series{margin-top:6px}
.series .ln{display:flex;justify-content:space-between;padding:2px 0}
.series .win{font-weight:800}
.series.mine{border-color:var(--orange)}

/* half court */
.court{position:relative;margin-top:8px;border-radius:18px;overflow:hidden;border:3px solid #3b5bdb;
  background:repeating-linear-gradient(90deg,#c98a4b 0 22px,#bd7e40 22px 23px,#d39556 23px 47px,#b77838 47px 48px,#cc8d4e 48px 70px,#c08143 70px 71px);
  aspect-ratio:400/330}
.court:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 61px,rgba(80,40,10,.18) 61px 62px),linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.12))}
.court svg.lines{position:absolute;inset:0;width:100%;height:100%}
.spot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:120px}
.tok{position:relative;width:54px;height:54px;border-radius:16px;background:linear-gradient(180deg,#1f2a4a,#121a33);border:3px solid #2f6fe0;display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.35);padding:0}
.tok svg{width:40px;height:40px;image-rendering:pixelated}
.tok.done{background:linear-gradient(180deg,#14532d,#0f3d22);border-color:#22c55e!important;box-shadow:0 0 0 3px rgba(34,197,94,.35),0 4px 10px rgba(0,0,0,.35)}
.tok.inj{filter:grayscale(1);opacity:.6}
.tok .ck{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#052e12;font-weight:900;font-size:13px;display:grid;place-items:center;border:2px solid #fff}
.tok .sc{position:absolute;top:-7px;left:-12px;background:#0b1020;font-size:12px;font-weight:900;border-radius:8px;padding:1px 7px;white-space:nowrap;border:1px solid var(--line)}
.tok .sc small{font-size:9px;color:var(--muted);font-weight:700}
.tok .sc.shot-layup{color:#cbd5e1}
.tok .stc{position:absolute;top:-4px;right:-6px;background:#0b1020;color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px;border:1px solid #fff}
.tag{margin-top:5px;background:rgba(11,16,32,.85);border-radius:9px;padding:3px 8px;font-size:11.5px;font-weight:800;max-width:122px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;text-align:center;line-height:1.25}
.tag .pn b.shot-layup{color:#cbd5e1}
.tag .pn{display:block;font-size:10px;font-weight:600;color:#aab3cf;overflow:hidden;text-overflow:ellipsis}
.tag .fire{font-size:10.5px}
.ballfx{position:absolute;left:0;top:0;width:34px;height:34px;z-index:5;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.ballfx .ball{width:34px;height:34px;margin:0;display:block}
.swish{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #ff7a1a;z-index:4;pointer-events:none;animation:swish .55s ease-out forwards}
@keyframes swish{from{transform:scale(.6);opacity:1}to{transform:scale(2.6);opacity:0}}
.plus{position:absolute;z-index:6;pointer-events:none;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #b45309,0 0 10px rgba(255,122,26,.8);transform:translate(-50%,-50%);animation:plus 1s ease-out forwards}
@keyframes plus{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-46px}}
.court-dark{background:repeating-linear-gradient(90deg,#6b4226 0 22px,#5e3a20 22px 23px,#744828 23px 47px,#56341c 47px 48px,#6f4527 48px 70px,#603b21 70px 71px)}
.court-blue{background:repeating-linear-gradient(90deg,#2b5aa8 0 22px,#264f95 22px 23px,#3163b4 23px 47px,#22488a 47px 48px,#2d5dae 48px 70px,#27519a 70px 71px);border-color:#fbbf24}
.court-street{background:radial-gradient(circle,rgba(255,255,255,.07) 0 1px,transparent 2px) 0 0/9px 9px,radial-gradient(circle,rgba(0,0,0,.18) 0 1px,transparent 2px) 4px 5px/11px 11px,#525a66;border-color:#9ca3af}
.court-neon{background:repeating-linear-gradient(90deg,#141a2e 0 22px,#111727 22px 23px,#161d33 23px 47px,#0f1424 47px 48px);border-color:#22d3ee}
.court-neon svg.lines{stroke:#22d3ee;filter:drop-shadow(0 0 3px #22d3ee)}
.court-neon:before{background:none}
.court-beach{background:radial-gradient(circle,rgba(120,80,20,.12) 0 1px,transparent 2px) 0 0/7px 7px,#e8cf98;border-color:#0ea5e9}
.court-beach:before{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(0,0,0,.05))}
.ballfx.lightning{filter:drop-shadow(0 0 5px #22d3ee) drop-shadow(0 0 10px #a5f3fc)}
.spark{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:2px;background:#a5f3fc;box-shadow:0 0 8px #22d3ee;z-index:4;pointer-events:none;animation:ember .35s ease-out forwards}
.swish.lightning{border-color:#22d3ee;box-shadow:0 0 14px #22d3ee}
.conf{position:absolute;width:6px;height:9px;margin:-4px 0 0 -3px;z-index:5;pointer-events:none;border-radius:1px;animation:conf .9s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.court-street:before{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(0,0,0,.25))}
.ballfx.fire{filter:drop-shadow(0 0 5px #ff5a00) drop-shadow(0 0 10px #ffb000)}
.ballfx.rainbow .ball{animation:hue .45s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.ember{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:radial-gradient(#fff3b0,#ff7a1a 55%,#ff3b00);z-index:4;pointer-events:none;animation:ember .45s ease-out forwards}
@keyframes ember{to{transform:scale(.2);opacity:0}}
.swish.fire{border-color:#ff3b00;box-shadow:0 0 12px #ff7a1a}
.swish.rainbow{border-color:#a78bfa;box-shadow:0 0 0 3px #22c55e,0 0 0 6px #fbbf24,0 0 0 9px #ef4444}
.lvl.locked{opacity:.5}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.35)}
.ach{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ach:first-child{border-top:0}
.ach .ic{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--panel2);border:1px solid var(--line)}
.ach.got .ic{background:linear-gradient(135deg,#fbbf24,#ff7a1a);border-color:#fbbf24}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.6}
.ach .pbar{height:6px;background:#0c1226;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.ach .pbar i{display:block;height:100%;background:var(--orange)}
.ach.got .pbar i{background:var(--gold)}
nav button{position:relative}
nav button.new:after{content:"";position:absolute;top:4px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.score .lead2{color:#fca5a5}
.clock{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
.clock b{color:var(--text)}
.bar.opp{height:5px;margin:0 0 10px;opacity:.9}
.bar.opp i{background:#cbd5e1}
.bar+.bar{margin-top:-2px}
.coach{display:flex;gap:10px;align-items:center;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.coach>span{font-size:20px}
.stgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stgrid b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stgrid span{font-size:11px;color:var(--muted)}
.form{display:flex;gap:4px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.form i{width:14px;height:14px;border-radius:4px;background:var(--panel2);border:1px solid var(--line)}
.form i.y{background:var(--green);border-color:var(--green)}.form i.n{background:rgba(240,82,82,.35);border-color:rgba(240,82,82,.5)}.form i.i{background:#475569}.form i.t{border-style:dashed}
.av{position:relative;border-width:2px;overflow:visible}
.av .num{position:absolute;right:-6px;bottom:-6px;min-width:20px;height:18px;padding:0 4px;border-radius:7px;font-size:10px;font-weight:900;color:#0b1020;display:grid;place-items:center;border:2px solid var(--panel)}
.ptsb{flex:none;font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.ptsb small{font-size:10px;font-weight:700;color:var(--muted)}
.ptsb.shot-layup{color:#cbd5e1}
.pl.done .ptsb{border-color:rgba(34,197,94,.5)}
.tro{display:inline-grid;place-items:center;flex:none}
.tro svg{width:100%;height:100%;image-rendering:pixelated}
.stakes{margin-bottom:12px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border-radius:14px;background:radial-gradient(100% 80% at 50% 0%,rgba(251,191,36,.12),transparent 70%),var(--panel2);border:1px solid var(--line)}
.tcard b{font-size:14px;line-height:1.2}
.tcard.won{border-color:var(--gold);box-shadow:0 0 0 1px rgba(251,191,36,.35)}
.tstat{margin-top:4px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:#0c1226;color:var(--muted)}
.tstat.g{color:var(--green)}.tstat.w{color:#1a1000;background:var(--gold)}
.pl.divon{border-color:var(--orange)}
.prem{background:radial-gradient(120% 90% at 100% 0%,rgba(251,191,36,.14),transparent 60%),var(--panel);border-color:rgba(251,191,36,.35)}
.prem.on{border-color:var(--gold)}
.switch{width:50px;height:30px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#94a3b8;transition:left .2s}
.switch.on{background:var(--gold);border-color:var(--gold)}.switch.on i{left:24px;background:#1a1000}
.drops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.drop{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.drop b{font-size:13px;line-height:1.2}
.dprev{width:54px;height:54px;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:4px}
.dprev svg{width:46px;height:46px;image-rendering:pixelated}
.perks{margin:12px 0 6px;padding-left:18px;font-size:14px}
.perks li{margin:3px 0}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badges span{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#fbbf24,#ff7a1a)}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.gtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:8px 5px 7px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);min-width:0}
.gtile.on{border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.gtile.locked .gsw,.gtile.locked .gcourt,.gtile.locked .gshot,.gtile.locked .gn{opacity:.35}
.gn{font-size:11px;font-weight:700;line-height:1.15;text-align:center}
.gb{position:absolute;top:3px;right:4px;font-style:normal;font-size:12px}
.gsw{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.gcourt{display:block;width:100%;margin:0;border-width:2px;border-radius:7px;flex:none}
.gcourt svg{position:absolute;inset:0;width:100%;height:100%}
.gshot{position:relative;width:38px;height:38px;display:grid;place-items:center}
.gshot .ball{width:28px;height:28px;margin:0}
.gshot.fire .ball{filter:drop-shadow(0 0 4px #ff5a00) drop-shadow(0 0 8px #ffb000)}
.gshot.lightning .ball{filter:drop-shadow(0 0 4px #22d3ee) drop-shadow(0 0 8px #a5f3fc)}
.gshot.rainbow .ball{animation:hue 1.2s linear infinite}
.gshot em{position:absolute;right:-4px;top:-4px;font-style:normal;font-size:14px}
.faces{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.faces .face{width:46px;height:46px;border-radius:12px;border:2px solid;background:linear-gradient(180deg,#1f2a4a,#121a33);display:grid;place-items:center;padding:0}
.faces .face svg{width:38px;height:38px;image-rendering:pixelated}
.tabs.big button{padding:10px;font-size:15px}
.badge.logo{background:#0f1630;border:1px solid var(--line);box-shadow:none;padding:2px}
.badge.logo svg,.mini.logo svg{width:100%;height:100%;image-rendering:pixelated}
.mini.logo{background:none;padding:0}
.glogo{width:42px;height:42px;display:grid;place-items:center}.glogo svg{width:40px;height:40px;image-rendering:pixelated}
.gtile.locked .glogo{opacity:.35;filter:grayscale(.6)}
.dprev svg{width:46px;height:46px}
.schips{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
.schips::-webkit-scrollbar{display:none}
.schip{flex:none;white-space:nowrap;padding:7px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--text)}
.schip.hl{border-color:rgba(255,122,26,.6);background:rgba(255,122,26,.12)}
.trow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.trow:nth-child(2){border-top:0}
.trow b{font-size:14px}
.trow .tstat{margin:0;white-space:nowrap}
.rwrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rw{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.rw.got{border-color:rgba(251,191,36,.55)}
.rw:not(.got) .rwp{opacity:.55;filter:grayscale(.4)}
.rw b{display:block;font-size:12.5px;line-height:1.15}
.rw span{font-size:10.5px;color:var(--muted);text-transform:capitalize}
.rwp{width:36px;height:36px;flex:none;border-radius:9px;background:#0f1630;display:grid;place-items:center;overflow:hidden;position:relative}
.rwp svg{width:32px;height:32px;image-rendering:pixelated}
.rwp.court{display:block;aspect-ratio:auto;width:44px;height:36px}
.rwp.court svg{position:absolute;inset:0;width:100%;height:100%}
.rwp.gshot .ball{width:24px;height:24px}
.ach2{padding:12px 0;border-top:1px solid var(--line)}
.ach2:first-child{border-top:0}
.ach2 .ic{width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:20px;background:var(--panel2);border:1px solid var(--line)}
.ach2.got .ic{background:linear-gradient(135deg,#fbbf24,#ff7a1a);border-color:#fbbf24}
.ach2:not(.got) .ic{filter:grayscale(1);opacity:.6}
.ach2 .pbar{height:6px;background:#0c1226;border-radius:99px;overflow:hidden}
.ach2 .pbar i{display:block;height:100%;background:var(--orange)}
.rwis{display:flex;gap:6px;flex:none}
.rwi{border-radius:11px;border:1.5px solid var(--line);padding:2px;display:block}
.rwi.got{border-color:rgba(251,191,36,.7)}
.rwi:not(.got) .rwp{opacity:.55;filter:grayscale(.4)}
.rwi .rwp{width:44px;height:44px}.rwi .rwp svg{width:38px;height:38px}
/* ---- scoreboard themes ---- */
.gboard{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;height:40px;border-radius:8px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;padding:0 4px;box-sizing:border-box;position:relative;overflow:hidden}
.gboard i{font-style:normal;opacity:.6}
.rwp .gboard{width:52px;height:36px;font-size:13px}
.gtile.locked .gboard{opacity:.4}
.sb-classic.gboard{background:radial-gradient(120% 140% at 50% -20%,#2a1a0e 0%,#141b2e 60%);border:1px solid #3a2a1c;color:#fff}
.sb-classic.gboard b:first-child{color:var(--orange)}
/* Retro LED */
.sb-led{background:radial-gradient(circle,rgba(255,176,0,.06) 0 1px,transparent 1.5px) 0 0/6px 6px,#0a0806!important;border:3px solid #2b2b2b!important;box-shadow:inset 0 0 0 2px #000}
.sb-led .score,.sb-led.gboard{font-family:"Courier New",ui-monospace,monospace;color:#ffb000;text-shadow:0 0 6px rgba(255,160,0,.8),0 0 14px rgba(255,120,0,.4)}
.sb-led .score .lead,.sb-led .score .lead2{color:#ffd166}
.sb-led .phase,.sb-led .clock,.sb-led .status,.sb-led .tmname,.sb-led .rec{font-family:"Courier New",ui-monospace,monospace;color:#ff9d00;text-shadow:0 0 4px rgba(255,140,0,.6)}
.sb-led:after,.sb-chalk:after,.sb-broadcast:after,.sb-gold:after,.sb-neon:after,.sb-arcade:after{display:none}
/* Chalkboard */
.sb-chalk{background:radial-gradient(120% 100% at 30% 0%,rgba(255,255,255,.06),transparent 60%),#20392b!important;border:7px solid #7a4e2a!important;box-shadow:inset 0 0 18px rgba(0,0,0,.45)}
.sb-chalk .score,.sb-chalk.gboard{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;color:#f4f1e8;text-shadow:0 0 1px rgba(255,255,255,.5)}
.sb-chalk.gboard{border-width:3px!important}
.sb-chalk .score .lead{color:#fde68a}.sb-chalk .score .lead2{color:#fecaca}
.sb-chalk .phase,.sb-chalk .clock,.sb-chalk .status,.sb-chalk .tmname,.sb-chalk .rec{font-family:"Chalkboard SE","Comic Sans MS","Marker Felt",cursive;color:#e7e2d4}
/* Broadcast */
.sb-broadcast{background:linear-gradient(90deg,#1e3a8a 0 50%,#7f1d1d 50% 100%)!important;border:0!important;padding-top:26px!important}
.sb-broadcast .score{background:#0b1020;padding:6px 12px;border-radius:10px;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sb-broadcast .phase{color:#fff;background:rgba(0,0,0,.35);display:inline-block;white-space:nowrap;font-size:10.5px;padding:2px 10px;border-radius:4px;margin-left:50%;transform:translateX(-50%)}
.sb-broadcast .clock{color:#e2e8f0}.sb-broadcast .status{color:#fff}
.sb-broadcast .score .lead{color:#fbbf24}.sb-broadcast .score .lead2{color:#fca5a5}
.livebug{position:absolute;top:8px;left:10px;background:#dc2626;color:#fff;font-size:10px;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:3px}
.sb-broadcast.gboard{border:0!important;color:#fff;padding:0 4px!important}
.sb-broadcast.gboard b{background:#0b1020;padding:0 3px;border-radius:3px}
/* Gold Edition */
.sb-gold{background:radial-gradient(120% 120% at 50% 0%,#3a2a08,#0b0905 70%)!important;border:2px solid #d4a017!important;box-shadow:0 0 0 1px #6b4f0a,inset 0 0 24px rgba(212,160,23,.15)}
.sb-gold .score,.sb-gold.gboard{background:linear-gradient(180deg,#fff3c4,#fbbf24 45%,#b45309);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-gold.gboard{background:radial-gradient(120% 120% at 50% 0%,#3a2a08,#0b0905 70%),#000!important}
.sb-gold.gboard b,.sb-gold.gboard i{background:linear-gradient(180deg,#fff3c4,#fbbf24 45%,#b45309);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-gold .score span{color:transparent!important}
.sb-gold .phase,.sb-gold .clock{color:#fbbf24}.sb-gold .status{color:#fde68a}
/* Neon */
.sb-neon{background:#120624!important;border:2px solid #d946ef!important;box-shadow:0 0 14px rgba(217,70,239,.5),inset 0 0 18px rgba(34,211,238,.15)}
.sb-neon .score,.sb-neon.gboard{color:#f5d0fe;text-shadow:0 0 4px #e879f9,0 0 12px #d946ef,0 0 24px #a21caf}
.sb-neon .score .lead,.sb-neon.gboard b:first-child{color:#cffafe;text-shadow:0 0 4px #67e8f9,0 0 12px #22d3ee,0 0 24px #0891b2}
.sb-neon .phase,.sb-neon .clock{color:#67e8f9;text-shadow:0 0 6px #22d3ee}.sb-neon .status{color:#f5d0fe}
/* Arcade */
.sb-arcade{background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px),#000!important;border:4px solid #fff!important;border-radius:6px!important;image-rendering:pixelated}
.sb-arcade .score,.sb-arcade.gboard{font-family:"Courier New",ui-monospace,monospace;color:#39ff14;text-shadow:3px 3px 0 #0a5c00;letter-spacing:.02em}
.sb-arcade .score .lead{color:#fffb00;text-shadow:3px 3px 0 #7a6a00}.sb-arcade .score .lead2{color:#ff3b3b;text-shadow:3px 3px 0 #6b0000}
.sb-arcade .phase,.sb-arcade .clock,.sb-arcade .status,.sb-arcade .tmname,.sb-arcade .rec{font-family:"Courier New",ui-monospace,monospace;color:#fff;text-transform:uppercase}
.sb-arcade.gboard{border-width:2px!important;text-shadow:2px 2px 0 #0a5c00}
/* ---- win celebrations ---- */
.gcel{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:#0f1630;border:1px solid var(--line)}
.gcel.c-stamp{font-weight:900;font-size:22px;color:#fff;background:#dc2626;border-radius:50%;border:3px solid #fff;font-family:system-ui}
.gcel.c-goldrain{background:radial-gradient(#5a420a,#1a1305)}
.gcel.c-lasers{background:linear-gradient(135deg,#3b0764,#0c4a6e)}
.gcel.c-fireworks{background:#0b1030}
.gtile.locked .gcel{opacity:.4;filter:grayscale(.6)}
.rwp .gcel{width:36px;height:36px;font-size:20px}
.celeb{position:fixed;inset:0;z-index:60;background:rgba(5,8,20,.4);pointer-events:auto;overflow:hidden;transition:opacity .45s}
.celeb.out{opacity:0}
.celeb i{position:absolute;display:block;font-style:normal;pointer-events:none}
.cel-txt{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);text-align:center;z-index:3;animation:celpop .55s cubic-bezier(.2,1.6,.4,1) both}
.cel-txt b{display:block;font-family:"Arial Narrow",system-ui,sans-serif;font-stretch:condensed;font-weight:900;font-size:58px;letter-spacing:.04em;color:#fff;text-shadow:0 4px 0 #b45309,0 0 26px rgba(255,122,26,.9)}
.cel-txt span{display:inline-block;margin-top:6px;font-weight:800;font-size:15px;color:#fff;background:rgba(11,16,32,.75);padding:4px 12px;border-radius:99px}
@keyframes celpop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.celeb .cf{top:-20px;border-radius:2px;animation:cffall 2.2s cubic-bezier(.3,.6,.5,1) forwards}
@keyframes cffall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
.celeb .stamp{left:50%;top:36%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:#dc2626;border:8px solid #fff;color:#fff;font:900 96px/134px system-ui;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6);animation:stampin .45s cubic-bezier(.3,1.5,.5,1) both;z-index:2}
.c-stamp .cel-txt{top:62%}
@keyframes stampin{from{transform:scale(3.5) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.celeb .fw{width:6px;height:6px;margin:-3px;border-radius:50%;opacity:0;animation:fwb 1.3s ease-out forwards}
@keyframes fwb{0%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),calc(var(--dy) + 30px))}}
.c-fireworks{background:rgba(5,8,25,.55)}
.celeb .cr{bottom:-60px;animation:crup 2.2s ease-out forwards}
@keyframes crup{0%{transform:translateY(0)}35%{transform:translateY(-150px)}60%{transform:translateY(-110px)}100%{transform:translateY(-170px);opacity:0}}
.celeb .roar{left:0;right:0;bottom:0;height:40%;background:linear-gradient(0deg,rgba(255,122,26,.45),transparent)}
.celeb .coin{top:-30px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#fbbf24 45%,#b45309);border:2px solid #92400e;animation:cffall 2s cubic-bezier(.4,.2,.6,1) forwards;--r:720deg}
.celeb .flash{inset:0;background:radial-gradient(circle at 50% 36%,rgba(251,191,36,.55),transparent 60%);animation:fl .9s ease-out forwards}
@keyframes fl{from{opacity:1}to{opacity:.25}}
.c-goldrain .cel-txt b{text-shadow:0 4px 0 #92400e,0 0 30px rgba(251,191,36,1);color:#fff8dc}
.celeb .laser{bottom:0;width:6px;height:120vh;transform-origin:50% 100%;border-radius:3px;animation:lz 2.3s ease-in-out both}
@keyframes lz{0%{transform:rotate(var(--a0));opacity:0}15%{opacity:1}50%{transform:rotate(var(--a1))}100%{transform:rotate(var(--a0));opacity:.8}}
.c-lasers{background:rgba(10,4,30,.6)}
.c-lasers .cel-txt b{color:#f5d0fe;text-shadow:0 0 6px #e879f9,0 0 20px #d946ef,0 0 40px #22d3ee}
.jsy{display:block;width:100%;height:auto}
.gjersey{width:42px;height:46px;display:block}
.gtile.locked .gjersey{opacity:.4;filter:grayscale(.5)}
.rwp .jsy{width:30px}
.dprev .gjersey{width:44px;height:48px}
.jrow{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border-radius:14px;background:radial-gradient(120% 120% at 0% 0%,rgba(255,255,255,.05),transparent 60%),var(--panel2);border:1px solid var(--line)}
.jbig{width:96px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.rafters{background:linear-gradient(180deg,#0a0f1f,#141b2e);padding:14px 12px}
.banners{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.banner2{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 6px 20px;background:linear-gradient(180deg,#1e293b,#0f172a);border:1px solid #334155;border-top:4px solid var(--gold);clip-path:polygon(0 0,100% 0,100% 92%,50% 100%,0 92%)}
.banner2 .jsy{width:64px;margin-bottom:6px}
.banner2 b{font-size:12px}.banner2 span{font-size:10.5px;color:var(--muted);line-height:1.3}
/* ---- bench styles ---- */
.benchwrap .pl{position:relative}
.benchwrap>div+div{margin-top:10px}
.benchwrap:not(.bench-classic) .pl.done{outline:2px solid var(--green);outline-offset:-2px}
.bench-wood .pl{background:repeating-linear-gradient(0deg,#8a5a32 0 11px,#6f4524 11px 12px);border-color:#4a2c14;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.08)}
.bench-wood .pl .nm{color:#fff8ee}.bench-wood .pl .meta{color:#f0d6b4}
.bench-courtside .pl{background:linear-gradient(180deg,#c42323,#7f1d1d);border:1px solid #5b1313;box-shadow:inset 0 0 0 4px #8f1c1c,inset 0 0 0 5px rgba(255,255,255,.28)}
.bench-courtside .pl .meta{color:#fecaca}
.bench-locker .pl{background:linear-gradient(90deg,#4b5563,#9ca3af 45%,#6b7280);border:1px solid #1f2937;padding-left:22px}
.bench-locker .pl:before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:8px;background:repeating-linear-gradient(0deg,#1f2937 0 2px,transparent 2px 5px);border-radius:2px}
.bench-locker .pl .nm{color:#0b1020}.bench-locker .pl .meta{color:#1f2937}
.bench-locker .ptsb{background:#1f2937}
.bench-vip .pl{background:radial-gradient(120% 160% at 0 0,#2e2419,#0d0a07);border:1.5px solid #d4a017;box-shadow:inset 0 0 0 3px #0d0a07,inset 0 0 0 4px rgba(212,160,23,.4)}
.bench-vip .pl .nm{color:#fde68a}.bench-vip .pl .meta{color:#c9a961}
.bench-neon .pl{background:#0e0620;border:1.5px solid #22d3ee;box-shadow:0 0 10px rgba(34,211,238,.35),inset 0 0 12px rgba(217,70,239,.15)}
.bench-neon .pl .nm{color:#f5d0fe;text-shadow:0 0 6px rgba(217,70,239,.7)}.bench-neon .pl .meta{color:#67e8f9}
.bench-velvet .pl{background:radial-gradient(circle at 25% 20%,#7c3aed,#3b0764 70%);border:1px solid #a78bfa;box-shadow:inset 0 2px 0 rgba(255,255,255,.12)}
.bench-velvet .pl .meta{color:#ddd6fe}
.bench-spooky .pl{background:radial-gradient(90% 140% at 100% 100%,rgba(249,115,22,.22),transparent 55%),linear-gradient(180deg,#2a1838,#120818);border:1.5px solid #f97316;box-shadow:0 0 10px rgba(249,115,22,.25),inset 0 0 14px rgba(124,58,237,.25)}
.bench-spooky .pl:before{content:"";position:absolute;left:0;top:0;width:26px;height:26px;opacity:.5;pointer-events:none;background:repeating-radial-gradient(circle at 0 0,transparent 0 6px,#e9d5ff 6px 7px),conic-gradient(from 90deg at 0 0,#e9d5ff 0 1deg,transparent 1deg 30deg,#e9d5ff 30deg 31deg,transparent 31deg 60deg,#e9d5ff 60deg 61deg,transparent 61deg);-webkit-mask:radial-gradient(circle at 0 0,#000 0 25px,transparent 26px);mask:radial-gradient(circle at 0 0,#000 0 25px,transparent 26px);border-top-left-radius:14px}
.bench-spooky .pl .nm{color:#fed7aa}.bench-spooky .pl .meta{color:#c084fc}
.bench-spooky .ptsb{background:#1a0b26;border-color:#f97316;color:#fdba74}
.bench-spooky .sect,.bench-spooky h3{color:#fb923c}
.gbench{display:flex;flex-direction:column;gap:4px;width:46px;padding:2px 0}
.gbench .pl{position:relative;display:block;height:13px;min-height:0;padding:0!important;border-radius:4px;margin:0!important}
.gbench .pl:before{top:3px;bottom:3px;left:3px;width:4px}
.gbench.bench-classic .pl{background:var(--panel);border:1px solid var(--line)}
.gtile.locked .gbench{opacity:.4;filter:grayscale(.5)}
.rwp .gbench{width:34px}
.mrow{display:flex;align-items:center;gap:8px;margin-top:3px}
.mjs{width:38px;flex:none;margin-left:-2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.tok .tjs svg{width:100%!important;height:auto!important}
.tok .tjs{position:absolute;left:-10px;bottom:-8px;width:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));pointer-events:none}
.ecard{margin-top:12px;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.ehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ehead span{text-align:right}
.flab{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
.ecard input{background:var(--panel);padding:10px 12px}
.ta{width:100%;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
.lnk{font-size:12px;font-weight:700;color:var(--orange2);text-transform:none;letter-spacing:0}
.ecard .ggrid{margin-top:0}
.ecard .btn+.btn,.ecard .lvls+.btn{margin-top:8px}
.ecard .jbig{width:84px}
.rcol{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.rcol .posn{font-size:11.5px}
.hidden{display:none}
.lookrow{display:flex;justify-content:center;align-items:center;gap:22px}
.headbtn{position:relative;width:92px;height:92px;border-radius:20px;border:3px solid;background:linear-gradient(180deg,#1f2a4a,#121a33);display:grid;place-items:center;padding:0;box-shadow:0 6px 14px rgba(0,0,0,.35);transition:transform .15s}
.headbtn svg{width:76px;height:76px;image-rendering:pixelated}
.headbtn:active{transform:scale(.96)}
.headbtn .hedit{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);white-space:nowrap;background:var(--orange);color:#1a0d00;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.headbtn.open{box-shadow:0 0 0 3px rgba(255,122,26,.5),0 6px 14px rgba(0,0,0,.35)}

.nmrow{display:flex;gap:10px;margin-top:22px}

.ggrid.frozen{opacity:.45;pointer-events:none;filter:grayscale(.3)}

.top .wlf{display:flex;gap:4px;align-self:center;flex:none}

.wlf .fW{background:rgba(34,197,94,.18);color:var(--green);border:1px solid rgba(34,197,94,.45)}
.wlf .fL{background:rgba(240,82,82,.15);color:var(--red);border:1px solid rgba(240,82,82,.4)}

/* ---- themed tournament cards ---- */
.evc{padding:2px 14px;margin-bottom:12px;--ea:var(--orange2);--eb:var(--line);--et:var(--panel2)}

.ev-ny .ach b.sp{font-family:Monoton,cursive;font-weight:400;font-size:18px;letter-spacing:.04em;color:#fde68a;text-shadow:0 0 6px rgba(251,191,36,.7),0 0 16px rgba(244,114,182,.45)}

.ev-hw{background:radial-gradient(130% 90% at 100% 0%,rgba(249,115,22,.22),transparent 55%),linear-gradient(180deg,#2a1440,#120818);border-color:#f97316;--ea:#fb923c;--eb:#5b2a80;--et:#1c0d2b}
.ev-wc{background:radial-gradient(130% 90% at 100% 0%,rgba(186,230,253,.18),transparent 55%),linear-gradient(180deg,#123354,#08182b);border-color:#7dd3fc;--ea:#bae6fd;--eb:#1f4e79;--et:#0b2340}
.ev-ny{background:radial-gradient(60% 50% at 85% 10%,rgba(244,114,182,.22),transparent 70%),radial-gradient(50% 40% at 10% 0%,rgba(251,191,36,.16),transparent 70%),linear-gradient(180deg,#1c1840,#0a0820);border-color:#fbbf24;--ea:#fcd34d;--eb:#3b2f6b;--et:#151133}
.ev-ss{background:radial-gradient(130% 90% at 100% 0%,rgba(249,168,212,.22),transparent 55%),linear-gradient(180deg,#3a1a35,#160b18);border-color:#f9a8d4;--ea:#f9a8d4;--eb:#5e2f55;--et:#24101f}
.ev-ss .evt .req{color:#86efac}
.evc .bracket{margin-top:0}
.ev-hw .btn{background:#2a1238;border-color:#f97316;color:#fed7aa}
/* ---- squad: team header + player cards ---- */
.teamhd{position:relative;overflow:hidden;border-radius:18px;padding:14px 14px 10px;margin-bottom:6px;border:1px solid var(--line);background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--kc) 30%,transparent),transparent 60%),linear-gradient(180deg,#151d33,#0e1426)}
.th-main{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.th-logo{width:58px;height:58px;flex:none;border-radius:14px;background:#0b1020;border:1px solid var(--line);display:grid;place-items:center;padding:6px}
.th-logo svg{width:44px;height:44px}
.th-city{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.th-name{font-size:24px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-sub{font-size:12px;color:var(--muted);margin-top:3px}
.th-kit{width:62px;flex:none;background:none;border:0;padding:0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.teamhd .schips{margin-bottom:0}
.teamhd .schip{background:rgba(11,16,32,.6)}
.pcard .prow{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.pform{display:inline-flex;gap:3px}
.pform i{width:9px;height:9px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.pform i.y{background:var(--green);border-color:var(--green)}
.pform i.n{background:rgba(240,82,82,.45);border-color:rgba(240,82,82,.6)}
.pform i.i{background:#475569;border-color:#475569}
.pstk{font-size:11.5px;font-weight:800;color:#fdba74}
.ptag{font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:5px}
.ptag.fire{color:#1a0d00;background:linear-gradient(90deg,#fbbf24,#f97316)}
.ptag.cold{color:#bae6fd;background:rgba(56,189,248,.14);border:1px solid rgba(56,189,248,.4)}
.pcard.st-fire{border-color:rgba(249,115,22,.55);box-shadow:0 0 12px rgba(249,115,22,.18)}
.pcard.st-cold{border-color:rgba(56,189,248,.35)}
.stiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;border-radius:12px;background:rgba(11,16,32,.55);border:1px solid var(--line);text-align:left;color:var(--text);min-width:0}
.st-lab i{font-style:normal;font-size:11px;margin-right:4px;letter-spacing:0}
.st-lab{display:flex;align-items:center;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.st-val{font-size:15px;font-weight:800;white-space:nowrap}
.st-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.stile.on{border-color:rgba(255,122,26,.6);background:rgba(255,122,26,.10)}.stile.on .st-val{color:var(--orange2)}
.stile.empty .st-val{color:var(--red)}
.stile.lv-rookie .st-val{color:#d6a374}.stile.lv-pro .st-val{color:#cbd5e1}.stile.lv-allstar .st-val{color:var(--gold)}.stile.lv-hof .st-val{color:#7dd3fc}
/* ---- player profile ---- */
.backbtn{background:none;border:0;color:var(--orange2);font-weight:800;font-size:16px;padding:6px 0}
.prof{position:relative;text-align:center;padding:16px 14px 14px;border-radius:20px;border:1px solid var(--line);background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--pc) 28%,transparent),transparent 70%),linear-gradient(180deg,#151d33,#0e1426)}
.prof-art{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin-bottom:8px}
.prof-head{width:104px;height:104px;border-radius:24px;border:3px solid var(--pc);background:#0b1020;padding:8px;box-shadow:0 0 22px color-mix(in srgb,var(--pc) 35%,transparent)}
.prof-head svg{width:100%;height:100%}
.prof-jsy{width:74px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
.prof-name{font-size:26px;line-height:1.1}
.prof-habit{font-size:14px;margin-top:2px}
.prof-tags{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px}
.ptag.pos{border:1px solid;background:rgba(0,0,0,.2)}
.ptag.slot{color:var(--text);background:rgba(11,16,32,.6);border:1px solid var(--line)}
.grid30{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.grid30 i,.g30-key i{aspect-ratio:1;border-radius:5px;background:var(--panel2);border:1px solid var(--line)}
.grid30 i.y,.g30-key i.y{background:var(--green);border-color:var(--green)}
.grid30 i.n,.g30-key i.n{background:rgba(240,82,82,.45);border-color:rgba(240,82,82,.6)}
.grid30 i.i,.g30-key i.i{background:#475569;border-color:#475569}
.grid30 i.t,.g30-key i.t{border:1.5px dashed var(--orange2)}
.grid30 i.x{opacity:.35}
.g30-key{display:flex;gap:12px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.g30-key span{display:flex;align-items:center;gap:5px}.g30-key i{width:11px;height:11px;display:inline-block}
.aw-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.aw-row:first-child{border-top:0;padding-top:0}
.aw-ic{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--panel2);font-size:17px}
.aw-row.lead .aw-ic{background:rgba(251,191,36,.16);box-shadow:inset 0 0 0 1px rgba(251,191,36,.5)}
.aw-pos{font-size:12px;font-weight:800;color:var(--muted)}
.aw-pos.lead{color:#1a1000;background:var(--gold);padding:3px 8px;border-radius:99px}
.aw-pos.no{opacity:.5}
.aw-chips{display:flex;flex-wrap:wrap;gap:6px}
.aw-chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.45);color:#fde68a}
.aw-chip small{color:var(--muted);font-weight:600;margin-left:2px}
.sect .small{margin-left:auto}
.trrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;margin-bottom:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text)}
.trrow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trrow .sp small{display:block;font-size:12px;color:var(--muted)}
.trrow .ptsb{white-space:nowrap;font-size:14px;padding:4px 8px}
.trgo{font-size:12px;font-weight:800;color:var(--orange2);flex:none}
/* ---- hoop (themed per court) ---- */
.court .hoop{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;
  --bb:#f8fafc;--bbe:#0f172a;--bbm:#ff6a00;--rim:#ff6a00;--net:#ffffff;--nd:none;--glow:none}
.hoop .bb{fill:var(--bb);stroke:var(--bbe);stroke-width:1.5}
.hoop .bbm{fill:none;stroke:var(--bbm);stroke-width:1.4}
.hoop .arm{fill:var(--bbe)}
.hoop .rim{fill:none;stroke:var(--rim);stroke-width:3.2;filter:var(--glow)}
.hoop .net{fill:none;stroke:var(--net);stroke-width:1.2;stroke-opacity:.9;stroke-dasharray:var(--nd);transform-origin:200px 292px;transform-box:view-box}
.court-dark .hoop{--bb:#e5e7eb;--bbm:#ef4444;--rim:#ef4444}
.court-blue .hoop{--bb:#ffffff;--bbe:#1e3a8a;--bbm:#f97316;--rim:#f97316}
.court-street .hoop{--bb:#9ca3af;--bbe:#374151;--bbm:#4b5563;--rim:#6b7280;--net:#d1d5db;--nd:1.6 1.2}
.court-neon .hoop{--bb:rgba(34,211,238,.12);--bbe:#22d3ee;--bbm:#f0abfc;--rim:#f0abfc;--net:#67e8f9;--glow:drop-shadow(0 0 3px #e879f9)}
.court-beach .hoop{--bb:#fde68a;--bbe:#92400e;--bbm:#0ea5e9;--rim:#0ea5e9;--net:#a16207;--nd:2 1}
.court-spooky .hoop{--bb:#1c0d2b;--bbe:#f97316;--bbm:#a855f7;--rim:#f97316;--net:#e9d5ff;--nd:1 1.5;--glow:drop-shadow(0 0 4px #f97316)}
.court-playoffs .hoop{--bb:rgba(226,232,240,.85);--bbe:#8a6a12;--bbm:#fbbf24;--rim:#fbbf24;--net:#ffffff;--glow:drop-shadow(0 0 4px #fbbf24)}
/* ---- clutch time ---- */
.board.clutch{animation:clutchglow 1.6s ease-in-out infinite}
@keyframes clutchglow{0%,100%{box-shadow:0 0 0 1px rgba(239,68,68,.5),0 0 10px rgba(239,68,68,.25)}50%{box-shadow:0 0 0 2px rgba(239,68,68,.9),0 0 26px rgba(239,68,68,.55)}}
.clutchtag{display:inline-block;margin-right:6px;padding:1px 6px;border-radius:4px;background:#dc2626;color:#fff;font-weight:900;letter-spacing:.1em;animation:ctag 1s steps(2,jump-none) infinite}
@keyframes ctag{50%{background:#7f1d1d}}
.court .spotdim{position:absolute;inset:0;background:rgba(5,8,18,.45);z-index:1;pointer-events:none;transition:opacity .4s}
.court.clutch .spot{z-index:2}
.court.clutch .spot.need:before{content:"";position:absolute;left:50%;top:27px;width:130px;height:130px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,250,220,.42),rgba(255,250,220,.12) 45%,transparent 70%);pointer-events:none;z-index:-1;animation:spotpulse 1.8s ease-in-out infinite}
@keyframes spotpulse{50%{opacity:.65}}
.court.clutch .spot.need .tok{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 0 18px rgba(255,250,220,.6)}
.court.slowmo .spotdim{background:rgba(5,8,18,.6)}
.court.slowmo .spot{z-index:2}
.benchwrap .pl.need{box-shadow:0 0 0 2px rgba(255,250,220,.55),0 0 16px rgba(255,250,220,.25)}
.bzb{position:fixed;left:50%;top:38%;z-index:80;transform:translate(-50%,-50%) rotate(-8deg);display:flex;flex-direction:column;align-items:center;padding:12px 22px;border:5px solid #fff;border-radius:14px;background:#dc2626;box-shadow:0 0 0 4px #dc2626,0 12px 40px rgba(0,0,0,.6);animation:bzin .35s cubic-bezier(.2,1.6,.4,1) both;pointer-events:auto}
@keyframes bzin{from{transform:translate(-50%,-50%) scale(3) rotate(-25deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}}
.bzb b{font:900 34px/1 "Bebas Neue","Arial Narrow",sans-serif;letter-spacing:.06em;color:#fff;text-transform:uppercase}
.bzb.out{transition:opacity .45s,transform .45s;opacity:0;transform:translate(-50%,-60%) rotate(-8deg) scale(1.1)}
.celeb .siren{position:fixed;inset:0;background:radial-gradient(circle,transparent 35%,rgba(239,68,68,.5));animation:siren .3s ease-in-out 6 alternate}
@keyframes siren{from{opacity:.15}to{opacity:1}}
.celeb .horn{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) rotate(-8deg);font:900 44px/1 "Bebas Neue","Arial Narrow",sans-serif;letter-spacing:.06em;color:#fff;background:#dc2626;border:5px solid #fff;border-radius:14px;padding:8px 18px;white-space:nowrap;animation:bzin .35s cubic-bezier(.2,1.6,.4,1) both}
.gcel.c-buzzer{background:radial-gradient(#7f1d1d,#1a0505)}
/* ---- gameday moments ---- */
.gdov{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:radial-gradient(120% 80% at 50% 40%,rgba(20,28,52,.97),rgba(5,8,18,.98));animation:gdin .3s ease both}
.gdov.out{animation:gdout .35s ease both}
@keyframes gdin{from{opacity:0}to{opacity:1}}@keyframes gdout{to{opacity:0;transform:scale(1.04)}}
.gd-intro,.gd-reveal{width:min(92vw,420px);text-align:center;color:var(--text)}
.gd-lab{font:800 13px/1.2 "Arial Narrow",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--orange2);margin-bottom:22px;animation:gdin .4s .1s both}
.gd-vs{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gd-tm{display:flex;flex-direction:column;align-items:center;gap:6px;width:38%}
.gd-tm b{font-size:16px}.gd-tm small{font-size:12px;color:var(--muted)}
.gd-intro .gd-tm.l{animation:gdl .55s cubic-bezier(.2,1.3,.4,1) both}.gd-intro .gd-tm.r{animation:gdr .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes gdl{from{transform:translateX(-120%);opacity:0}}@keyframes gdr{from{transform:translateX(120%);opacity:0}}
.gd-v{font:400 54px/1 "Bebas Neue","Arial Narrow",sans-serif;color:#fff;text-shadow:0 0 18px rgba(255,122,26,.7);animation:gdv .5s .35s cubic-bezier(.2,1.6,.4,1) both}
@keyframes gdv{from{transform:scale(3);opacity:0}}
.gd-when{margin-top:24px;font-weight:800;font-size:14px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;animation:gdin .4s .6s both}
.gd-skip{margin-top:28px;font-size:11px;color:#475569}
.gd-intro.spooky .gd-lab{color:#fb923c}.gd-intro.spooky .gd-v{font-family:Creepster,cursive;color:#fb923c;text-shadow:0 0 18px rgba(249,115,22,.8),3px 3px 0 #3b0764}
.gd-intro.playoffs .gd-lab{color:#fbbf24}.gd-intro.playoffs .gd-v{background:linear-gradient(180deg,#fff3c4,#fbbf24 50%,#b45309);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.gd-sc{display:flex;align-items:center;gap:8px;font:400 56px/1 "Bebas Neue","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;color:#94a3b8}
.gd-sc i{font-style:normal;font-size:34px;color:#475569}.gd-sc span.hi{color:#fff;text-shadow:0 0 14px rgba(255,255,255,.35)}
.gd-stamp{display:inline-flex;align-items:baseline;gap:6px;margin-top:26px;padding:6px 22px;border:4px solid;border-radius:12px;font:400 46px/1 "Bebas Neue","Arial Narrow",sans-serif;letter-spacing:.08em;opacity:0;transform:scale(2.6) rotate(-14deg)}
.gd-stamp small{font-size:20px}
.gd-stamp.w{color:#22c55e;border-color:#22c55e;box-shadow:0 0 22px rgba(34,197,94,.35)}.gd-stamp.l{color:#f05252;border-color:#f05252}
.gd-stamp.in{animation:gdst .35s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes gdst{to{opacity:1;transform:scale(1) rotate(-6deg)}}
.score{position:relative}
.opp-pop{position:absolute;right:-6px;top:-14px;font-size:15px;font-weight:900;color:#f87171;text-shadow:0 2px 6px rgba(0,0,0,.5);animation:opppop 1.4s ease-out forwards;pointer-events:none;font-family:system-ui;letter-spacing:0}
@keyframes opppop{0%{opacity:0;transform:translateY(6px)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-16px)}}
.pcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-ghost{position:fixed;z-index:95;pointer-events:none;margin:0!important;transform:scale(1.04) rotate(-1.5deg);box-shadow:0 18px 40px rgba(0,0,0,.6),0 0 0 2px var(--orange);opacity:.95}
.pcard.drag-src{opacity:.35}
body.dragging .pcard.drop-no{opacity:.35;filter:grayscale(.6)}
body.dragging .pcard.drop-ok{outline:2px dashed rgba(255,122,26,.7);outline-offset:-2px}

<script>
'use strict';
/* ===================== constants ===================== */
const SHOTS={layup:{n:'Layup',pts:6},jumper:{n:'Jumper',pts:11},three:{n:'Three',pts:17},dunk:{n:'Slam dunk',pts:30}};
const SHOT_ORDER=['layup','jumper','three','dunk'];
const POS=[{id:'fitness',n:'Fitness',a:'FIT',c:'#ef4444'},{id:'mind',n:'Mind',a:'MND',c:'#a78bfa'},{id:'routine',n:'Routine',a:'RTN',c:'#2dd4bf'},{id:'home',n:'Home',a:'HOM',c:'#fbbf24'},{id:'money',n:'Money',a:'MNY',c:'#22c55e'}];
const posById=id=>POS.find(p=>p.id===id);
const CUSTOM_SHOT='jumper', MAX_CUSTOM=2, BENCH_SIZE=5, INJURY_USES=3, TRANSFER_DAYS=7;
// Rest days: each player can rest up to INJURY_USES days per week (Mon–Sun). Good for habits that aren't daily, like the gym.
const weekStart=d=>{const dt=parse(d),wd=(dt.getDay()+6)%7;return addDays(d,-wd)};
const restsUsed=(id,d)=>{const w=weekStart(d||gameDate());let n=0;for(let i=0;i<7;i++){const D=S.days[addDays(w,i)];if(D&&D.inj&&D.inj.includes(id))n++}return n};
const restsLeft=(id,d)=>Math.max(0,INJURY_USES-restsUsed(id,d));
// Planned rest days: p.restDays = weekdays (0 = Mon … 6 = Sun) that repeat every week, max INJURY_USES.
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const weekday=d=>(parse(d).getDay()+6)%7;
function planRests(D){
  if(!D||D.locked||D.planned||!D.d||D.d<gameDate())return;D.planned=1;D.auto=D.auto||[];const wd=weekday(D.d);
  for(const p of S.squad)if((p.restDays||[]).includes(wd)&&!D.inj.includes(p.id)&&!isDone(p,D)){D.inj.push(p.id);D.auto.push(p.id)}
}
// After the plan changes, update today (only before the 4th quarter) so the change takes effect straight away.
function replanToday(p){

// The opponent scores between 7am and 11pm in four quarters, in seeded bursts, reaching their final score by 11pm.
const TIPOFF_H=7,GAME_HRS=16;
function gameHours(d){const b=parse(d);b.setHours(TIPOFF_H,0,0,0);return(nowMs()-b)/36e5}
function oppProgress(d){
  const hrs=gameHours(d);if(hrs<=0)return 0;if(hrs>=GAME_HRS)return 1;
  const r=rng('pace'+d),w=[];for(let h=0;h<GAME_HRS;h++)w.push(.25+r()*1.5);const tot=w.reduce((a,b)=>a+b,0);
  const H=Math.floor(hrs);let acc=0;for(let i=0;i<H;i++)acc+=w[i];acc+=w[H]*(hrs-H);return acc/tot;
}
function quarter(d){const h=gameHours(d);return h<0?0:h>=GAME_HRS?5:Math.floor(h/4)+1}
const QLABEL=['Pre-game','Q1','Q2','Q3','Q4','Opponent finished'];
// coachNote: one gentle line about where you stand. Not shown in the app; kept as the text source for future phone notifications.
function coachNote(D,sc,oppLive){
  const t=gameDate(),q=quarter(t),opp=team(D.oppId).n;
  if(sc.max===0)return null;
  if(sc.me===sc.max)return{i:'🏆',m:'Perfect game. Every player scored.'};
  const left=S.squad.filter(p=>!D.inj.includes(p.id)&&!isDone(p,D)).sort((a,b)=>pv(b)-pv(a)||(a.slot==='court'?-1:1));
  const top=left[0],tip=top?` ${top.name} (${pv(top)} pts) is your best shot.`:'';
  if(q===0)return{i:'🌅',m:`Tip-off at ${TIPOFF_H}am. Get a head start${top?` with ${top.name}`:''}.`};
  if(q<=4){const gap=sc.me-oppLive;
    if(gap>0)return{i:q>=3?'💪':'👍',m:`Up ${gap} on ${opp} in ${QLABEL[q]}. They're still scoring, so keep going.`};
    if(gap===0)return{i:'⚖️',m:`All square in ${QLABEL[q]}.${tip}`};
    return{i:q>=3?'📣':'⏱️',m:`${opp} lead by ${-gap} in ${QLABEL[q]}.${tip}`};}
  // after 11pm the opponent is done, so their score is final and safe to talk about
  if(sc.me>sc.opp)return{i:'✅',m:`${opp} are done and you're ahead. Hold on until the 4am buzzer.`};
  const need=sc.opp-sc.me+1,one=left.filter(p=>pv(p)>=need).sort((a,b)=>pv(a)-pv(b))[0];
  return{i:'🌙',m:one?`${opp} are done. ${one.name} (${pv(one)} pts) would win it before 4am.`:`${opp} are done. You need ${need} more before 4am.`};
}

function clutchState(D){
  if(!D||D.locked||D.off||(D.ph==='brk'&&!D.ev))return null;const t=gameDate();if(D.d&&D.d!==t)return null;if(quarter(t)!==4)return null;

function shoot(id,bz){
  try{if(matchMedia('(prefers-reduced-motion: reduce)').matches){if(bz)buzzerStamp();return}}catch(e){}
  const court=document.querySelector('.court'),tok=court&&court.querySelector(`.tok[data-id="${id}"]`),p=S.squad.find(x=>x.id===id);
  if(!tok||!p){if(bz)buzzerStamp();return}
  const cr=court.getBoundingClientRect(),tr=tok.getBoundingClientRect();
  const x0=tr.left+tr.width/2-cr.left,y0=tr.top+tr.height/2-cr.top,x1=cr.width*.5,y1=cr.height*(292/330);
  const peak=Math.max(30,Math.min(y0,y1)-cr.height*.32),cy=2*peak-(y0+y1)/2,cx=(x0+x1)/2;
  const shotFx=(S.cos&&S.cos.shot)||'classic';const ball=document.createElement('div');ball.className='ballfx '+shotFx;ball.innerHTML=ballSvg();court.appendChild(ball);
  // Slower, bigger shot: arc, then drops through the net and fades. Long enough to see the ball skin.
  const kf=[],N=30,R=17,F=.85,at=(x,y,r,sc,o,off)=>kf.push({transform:`translate(${x-R}px,${y-R}px) rotate(${r}deg) scale(${sc})`,opacity:o,offset:off});

    const sc=1+.35*Math.sin(Math.PI*t)-.35*t; // grows toward the apex, shrinks into the hoop
    at(x,y,t*540,sc,1,t*F)}
  at(x1,y1+16,600,.6,0,1);                  // drops through the net and fades
  const fx=(cls,html)=>{const el=document.createElement('div');el.className=cls;el.style.left=x1+'px';el.style.top=y1+'px';if(html)el.textContent=html;court.appendChild(el);setTimeout(()=>el.remove(),1100)};
  const DUR=bz?2700:1450;let dim=null;if(bz){court.classList.add('slowmo');dim=document.createElement('div');dim.className='spotdim';court.appendChild(dim)}
  const a=ball.animate(kf,{duration:DUR,easing:bz?'cubic-bezier(.2,.6,.35,1)':'linear'});
  
  let emb=null;if(shotFx==='fire'||shotFx==='lightning')emb=setInterval(()=>{try{const m=new DOMMatrix(getComputedStyle(ball).transform);const e=document.createElement('div');e.className=shotFx==='fire'?'ember':'spark';e.style.left=(m.e+R)+'px';e.style.top=(m.f+R)+'px';court.appendChild(e);setTimeout(()=>e.remove(),500)}catch(_){}},30);
  setTimeout(()=>{clearInterval(emb);const nt=court.querySelector('.hoop .net');sfx('swish');buzz(bz?[30,40,30]:25);if(nt)nt.animate([{transform:'scale(1)'},{transform:'scale(1.35)'},{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:500});fx('swish '+shotFx);fx('plus','+'+pv(p));if(bz){court.classList.remove('slowmo');if(dim)dim.remove();buzzerStamp()}},DUR*F);
  a.onfinish=()=>{clearInterval(emb);ball.remove();
    if(shotFx==='confetti')for(let i=0;i<16;i++){const c=document.createElement('div');c.className='conf';c.style.left=x1+'px';c.style.top=y1+'px';c.style.background=['#ef4444','#fbbf24','#22c55e','#3b82f6','#ec4899','#a78bfa'][i%6];c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.setProperty('--dy',(-40-Math.random()*90)+'px');court.appendChild(c);setTimeout(()=>c.remove(),1000)}};
  setTimeout(()=>ball.remove(),2400);
}

function pStats(p){

let profId=null;
const AWARDS=[
 {id:'mvp',i:'👑',n:'MVP',d:'Most points scored'},
 {id:'iron',i:'🛡️',n:'Iron Man',d:'Longest streak of the month'},
 {id:'sixth',i:'🪑',n:'Sixth Man',d:'Most points from the bench'},
 {id:'improved',i:'📈',n:'Most Improved',d:'Biggest jump in completion vs last month'},
 {id:'closer',i:'🚨',n:'Closer',d:'Most points scored in clutch time'},
];
function monthLines(key,upto){
  const start=key+'-01',end=monthEnd(key),out={};
  for(const p of S.squad){let att=0,made=0,run=0,best=0;
    for(let d=start;d<=end&&d<upto;d=addDays(d,1)){const D=S.days[d];if(!D||!D.locked)continue;if(p.signedAt&&d<p.signedAt)continue;if(restD(D)||D.inj.includes(p.id))continue;
      att++;if(isDone(p,D)){made++;run++;if(run>best)best=run}else run=0}
    let cp=0;for(let d=start;d<=end&&d<upto;d=addDays(d,1)){const D=S.days[d];if(D&&D.locked&&D.cp&&D.cp[p.id])cp+=D.cp[p.id]}
    out[p.id]={att,made,best,pts:made*pv(p),pct:att?made/att:null,cp}}
  return out;
}
function awardRace(key,upto){
  const L=monthLines(key,upto),prevK=skey(addDays(key+'-01',-1)),P=monthLines(prevK,key+'-01'),ids=S.squad.map(p=>p.id);
  const rank=(score,ok=()=>true)=>ids.filter(id=>ok(id)&&score(id)>0).sort((a,b)=>score(b)-score(a));
  return{
    mvp:rank(id=>L[id].pts),
    iron:rank(id=>L[id].best),
    sixth:rank(id=>L[id].pts,id=>S.squad.find(p=>p.id===id).slot==='bench'),
    improved:rank(id=>Math.round((L[id].pct-P[id].pct)*100),id=>L[id].att>=5&&P[id].att>=5),
    closer:rank(id=>L[id].cp),
  };
}
// Finished months are decided once and kept, so later squad changes don't rewrite history.
function pastAwards(){
  S.awards=S.awards||{};const cur=skey(gameDate());
  for(const k of Object.keys(S.seasons||{}).sort()){if(k>=cur||S.awards[k])continue;
    const r=awardRace(k,addDays(monthEnd(k),1));S.awards[k]=Object.fromEntries(AWARDS.map(a=>[a.id,r[a.id][0]||null]))}
  return S.awards;
}

function gdMoments(){
  if(document.getElementById('gdov')||document.getElementById('celeb')||(PREVIEW&&PREVIEW.mode==='clutch'))return;
  const t=gameDate(),yd=addDays(t,-1),L=S.days[yd];
  if(S.newResult===yd&&L&&L.res&&!L.revealed){L.revealed=1;save();setTimeout(()=>showReveal(yd,()=>{
    if(L.res==='W'&&!L.cel){L.cel=1;save();celebrate(myCel(),'WIN',`${L.me}–${L.opp} vs ${team(L.oppId).n}`);setTimeout(maybeIntro,3000)}else maybeIntro()}),250);return}
  maybeIntro();
}
function gameLabel(D){return D.ph==='pre'?`Pre-season · Exhibition ${D.pn} of ${PRE_DAYS}`:D.ph==='brk'?`${D.ev} · ${HSE.rounds[Math.max(0,hsDays().findIndex(x=>x[0]===D.d))]}`:D.ph==='reg'?`Regular Season · Game ${D.gn}`:D.ph==='po'?`Playoffs · ${ROUND_NAMES[D.rd]} · Day ${D.g} of 2`:'Friendly'}
function maybeIntro(force){
  const t=gameDate(),D=ensureDay(t);if(view!=='today')return;
  if(!force){if(S.introDay===t||(PREVIEW&&PREVIEW.mode==='clutch'))return;S.introDay=t;save()}
  if(D.off||D.locked||(D.ph==='brk'&&!D.ev))return;
  const q=quarter(t),se=curSeason(),rec=id=>se&&D.ph!=='brk'&&D.ph!=='ex'?recordOf(id):'';
  const th=arenaTheme()||'';
  const o=overlay(`<div class="gd-intro ${th}"><div class="gd-lab">${esc(gameLabel(D))}</div>
    <div class="gd-vs"><div class="gd-tm l">${badge('me',78)}<b>${esc(S.team.name)}</b><small>${rec('me')}</small></div><div class="gd-v">VS</div><div class="gd-tm r">${badge(D.oppId,78)}<b>${esc(team(D.oppId).n)}</b><small>${rec(D.oppId)||esc(team(D.oppId).city)}</small></div></div>
    <div class="gd-when">${q===0?`Tip-off ${TIPOFF_H}am`:q>=5?'Final buzzer at 4am':`${QLABEL[q]} · live`}</div><div class="gd-skip">Tap to skip</div></div>`,2300);
  sfx('whistle');buzz(30);return o;

function showReveal(d,done){
  const L=S.days[d];if(!L||!L.res){if(done)done();return}
  const W=L.res==='W';
  const o=overlay(`<div class="gd-reveal"><div class="gd-lab">Final · ${esc(gameLabel(L))}</div>
    <div class="gd-vs"><div class="gd-tm l">${badge('me',64)}<b>${esc(S.team.name)}</b></div>
      <div class="gd-sc"><span id="rvA">0</span><i>–</i><span id="rvB">0</span></div>
      <div class="gd-tm r">${badge(L.oppId,64)}<b>${esc(team(L.oppId).n)}</b></div></div>
    <div class="gd-stamp ${W?'w':'l'}" id="rvS">${W?'WIN':'LOSS'}${L.ot?'<small>OT</small>':''}</div><div class="gd-skip">Tap to skip</div></div>`,3300,done);
  const a=o.querySelector('#rvA'),b=o.querySelector('#rvB'),t0=performance.now(),DUR=1200;

function overlay(html,ms,done){
  const old=document.getElementById('gdov');if(old)old.remove();
  const o=document.createElement('div');o.id='gdov';o.className='gdov';o.innerHTML=html;document.body.appendChild(o);
  let closed=false;const close=()=>{if(closed)return;closed=true;o.classList.add('out');setTimeout(()=>{o.remove();if(done)done()},350)};
  const tm=setTimeout(close,ms);o.addEventListener('click',()=>{clearTimeout(tm);close()});return o;
}

/* ===================== live opponent ticks ===================== */
// While Gameday is open, the opponent's score counts up as they score instead of jumping on the next refresh.
setInterval(()=>{
  if(view!=='today'||document.hidden)return;const el=document.getElementById('oppScore');if(!el||el.dataset.busy)return;
  const t=gameDate(),D=S.days[t];if(!D||D.locked)return;
  const to=Math.round(score(D).opp*oppProgress(t)),from=+el.dataset.v;if(!(to>from))return;
  el.dataset.busy=1;const pop=document.createElement('span');pop.className='opp-pop';pop.textContent='+'+(to-from);el.parentNode.appendChild(pop);setTimeout(()=>pop.remove(),1400);
  const t0=performance.now(),DUR=Math.min(1200,300+(to-from)*120);
  (function step(now){const k=Math.min(1,(now-t0)/DUR);el.textContent=Math.round(from+(to-from)*k);
    if(k<1)requestAnimationFrame(step);else{el.dataset.v=to;delete el.dataset.busy;setTimeout(()=>{if(view==='today'&&!document.getElementById('scrim')&&!document.querySelector('.ballfx')&&!document.getElementById('gdov'))render()},900)}})(t0);
},5000);

/* ===================== sound + vibration ===================== */
// All sounds are synthesised with Web Audio, so there are no files to download and it works offline.
let AC=null;
const sndOn=()=>S.sound!==false,hapOn=()=>S.haptics!==false;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',()=>{if(sndOn())actx()},{passive:true});
function buzz(pat){if(hapOn()&&navigator.vibrate)try{navigator.vibrate(pat)}catch(e){}}
function noiseBuf(c,sec){const b=c.createBuffer(1,c.sampleRate*sec,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function tone(c,type,f0,f1,t0,dur,vol,dest){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dur);
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.02);g.gain.setValueAtTime(vol,t0+dur*.7);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(dest);o.start(t0);o.stop(t0+dur+.05)}
function noise(c,t0,dur,vol,ftype,f0,f1,q,dest){const n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=noiseBuf(c,dur+.1);f.type=ftype;f.frequency.setValueAtTime(f0,t0);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);f.Q.value=q||1;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+dur*.15);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);n.connect(f).connect(g).connect(dest);n.start(t0);n.stop(t0+dur+.05)}
function sfx(name){
  if(!sndOn())return;const c=actx();if(!c||c.state!=='running')return;const t=c.currentTime+.01,out=c.createGain();out.gain.value=.55;out.connect(c.destination);
  if(name==='swish'){noise(c,t,.32,.9,'bandpass',2600,900,1.2,out);noise(c,t+.05,.18,.35,'highpass',5000,0,.7,out)}
  if(name==='tick'){tone(c,'triangle',880,1320,t,.08,.25,out)}
  if(name==='ooh'){ // disappointed crowd: many low voices sliding down, muffled
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=900;f.Q.value=.7;f.connect(out);
    for(let i=0;i<9;i++){const f0=150+Math.random()*90;tone(c,'sawtooth',f0,f0*.68,t+Math.random()*.08,1.2,.035,f)}
    noise(c,t,1.2,.18,'bandpass',600,350,1.2,out)}
  if(name==='whistle'){ // referee's pea whistle: high tone with a fast trill, plus breath
    [[0,.16],[.24,.42]].forEach(([d,len])=>{const t0=t+d,o=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),g=c.createGain();
      o.type='sine';o.frequency.setValueAtTime(2700,t0);o.frequency.linearRampToValueAtTime(3150,t0+.04);
      lfo.type='sine';lfo.frequency.value=38;lg.gain.value=170;lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.2,t0+.02);g.gain.setValueAtTime(.2,t0+len-.05);g.gain.linearRampToValueAtTime(0,t0+len);
      o.connect(g).connect(out);o.start(t0);lfo.start(t0);o.stop(t0+len+.02);lfo.stop(t0+len+.02);
      noise(c,t0,len,.07,'bandpass',3100,0,4,out)})}

// In-season subs: swap a starter with a bench player of the same category, any time, even mid-game.
// Points never depend on the role, so subs can't be gamed and there's no limit.
const subbedOff=()=>false; // no re-sub limit: subs are just for ordering your lineup
function subOptions(p,D){
  if(p.slot==='court')return S.squad.filter(x=>x.slot==='bench'&&x.pos===p.pos&&!subbedOff(D,x.id));
  const st=S.squad.find(x=>x.slot==='court'&&x.pos===p.pos);return st&&!subbedOff(D,p.id)?[st]:[];
}
function subRow(p,D){
  const o=subOptions(p,D);
  if(!o.length)return p.slot==='court'?`<div class="mvrow off"><span class="mvi">⇄</span><span class="sp"><b>Sub off</b><small>No ${posById(p.pos).n} player on the bench</small></span></div>`:'';
  return `<button class="mvrow" data-a="subSheet" data-id="${p.id}"><span class="mvi">⇄</span><span class="sp"><b>${p.slot==='court'?'Sub off':'Sub on'}</b><small>${p.slot==='court'?`Bring on a ${posById(p.pos).n} player from the bench`:`Replaces ${esc(o[0].name)} in the starting five`}</small></span><span class="mvc">›</span></button>`;
}
function subSheet(id){
  const p=S.squad.find(x=>x.id===id);if(!p)return;const D=ensureDay(gameDate());
  const starter=p.slot==='court'?p:S.squad.find(x=>x.slot==='court'&&x.pos===p.pos);
  const opts=p.slot==='court'?subOptions(p,D):[p];
  const row=x=>`<button class="trrow" data-a="doSub" data-out="${starter.id}" data-in="${x.id}">${avatar(x)}<span class="mjs">${jerseySvg(myKit(),ident(x).name,ident(x).num)}</span><span class="sp" style="min-width:0"><b>${esc(x.name)}</b><small>${esc(x.lvl)}${isDone(x,D)?' · ✓ done today':''}</small></span>${pts(x)}<span class="trgo">Sub on ›</span></button>`;
  sheet(`<h2>⇄ Sub off ${esc(starter.name)}</h2><p class="small muted" style="margin:0 0 10px">Swap with a ${posById(starter.pos).n} player from the bench. Points don't change, only who's on the court. Tip: you can also hold and drag cards on the Squad screen.</p>
    ${opts.length?opts.map(row).join(''):`<p class="muted">No ${posById(starter.pos).n} players available on the bench.</p>`}
`);
}

// Drag to sub (Squad screen): hold a player card, drag it onto a player in the same category in the other group, let go to swap.
function swapPlayers(a,b){
  if(a.slot===b.slot)return;if(a.pos!==b.pos)return toast(`Swap with a ${posById(a.pos).n} player`);

}
